# ── DNS 零泄漏闭环：纯 IP 形式国内 DoH 服务直连与节点解析；代理域名 100% 走 Fake-IP 由纽约落地远端解析 ──
dns-server = https://223.5.5.5/dns-query#no-h3, https://223.6.6.6/dns-query#no-h3
direct-dns-server = https://223.5.5.5/dns-query#no-h3, https://1.12.12.12/dns-query#no-h3
proxy-dns-server = https://223.5.5.5/dns-query#no-h3, https://223.6.6.6/dns-query#no-h3
fallback-dns-server = https://1.12.12.12/dns-query#no-h3, https://120.53.53.53/dns-query#no-h3

dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = false
# 严禁开启 SVCB 与非 A/AAAA 转发，防止代理域名的 HTTPS(Type 65)/TXT 查询泄漏至国内 DoH
allow-dns-svcb = false
allow-dns-all = false
use-local-host-item-for-proxy = false

hijack-dns = :53, 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 9.9.9.9:53, 149.112.112.112:53, 208.67.222.222:53, 208.67.220.220:53, 223.5.5.5:53, 223.6.6.6:53, 119.29.29.29:53, 1.12.12.12:53, 120.53.53.53:53, 114.114.114.114:53

# 企业内网 / Tailscale 返回私有 IP 时不判定为 DNS 劫持
private-ip-answer = true
always-reject-url-rewrite = true
icmp-auto-reply = false

# ── WebRTC / QUIC / UDP ──（严禁开启 stun-response-ip，会伪造 1.1.1.1 候选地址造成跨 ASN 冲突）
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

[Proxy]
# 机场节点由订阅动态提供；落地节点在小火箭首页手动添加：「🗽 纽约ISP落地」（必需）

[Proxy Group]
# ── 1. 自动优选：港/台/新/美/日/韩自动测速（含香港），剔除落地/住宅节点与订阅信息伪节点 ──
🚀 自动优选 = url-test, policy-regex-filter=(?i)^(?!.*(ISP落地|住宅|家宽|静态|原生落地|剩余|流量|到期|过期|重置|套餐|官网|订阅|客服|群组|频道|失联|故障|更新|维护|网址|备用|Traffic|Expire|Reset|Subscribe|Website))(?=.*(香港|台湾|台北|新加坡|狮城|美国|日本|韩国|首尔|(?<![A-Za-z])(HK|TW|SG|US|JP|KR)(?![A-Za-z])|Hong\s*Kong|Taiwan|Taipei|Singapore|United\s*States|America|Japan|Korea)).*$, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5

# ── 2. 核心账号锁定组（Fail-Closed：只含落地节点 + REJECT 保底）──
🤖 AI 服务 = select, REJECT, policy-regex-filter=^🗽 纽约ISP落地$, policy-select-name=🗽 纽约ISP落地

# 社交与创作者账号：与 AI 共用「🗽 纽约ISP落地」（单落地 IP）
🐦 社交账号 = select, REJECT, policy-regex-filter=^🗽 纽约ISP落地$, policy-select-name=🗽 纽约ISP落地

# ── 3. 链式前置（供落地节点「代理通过」调用；落地为 IP 白名单认证时前置出口必须固定）──
🌉 链式前置 = select, REJECT, policy-regex-filter=(?i)^(iGG-)?US\s*-\s*洛杉矶(\s*-\s*|\s+)13$, policy-select-name=iGG-US - 洛杉矶 - 13
# 备选单点前置（注释上面一行，改用其一）：
# 🌉 链式前置 = select, REJECT, policy-regex-filter=(?i)^(iGG-)?US\s*-\s*纽约(\s*-\s*|\s+)10$, policy-select-name=iGG-US - 纽约 - 10
# 🌉 链式前置 = select, REJECT, policy-regex-filter=(?i)^(iGG-)?US\s*-\s*美国原生(\s*-\s*|\s+)14$, policy-select-name=iGG-US - 美国原生 - 14
#
# 【可选：容灾模式，仅限落地节点为“账号密码认证”时使用；两行必须成对启用】
# ♻️ 前置容灾 = fallback, policy-regex-filter=(?i)^(?!.*(ISP落地|住宅|家宽|静态|原生落地|剩余|流量|到期|过期|重置|套餐|官网|订阅|客服|群组|频道|失联|故障|更新|维护|网址|备用|Traffic|Expire|Reset|Subscribe|Website|Hysteria|HY2|TUIC|WireGuard))(?=.*(美国|(?<![A-Za-z])US(?![A-Za-z])|United\s*States|America|纽约|洛杉矶|西雅图|圣何塞|硅谷|芝加哥|达拉斯|新泽西|华盛顿|亚特兰大|凤凰城)).*$, url=https://www.gstatic.com/generate_204, interval=300, timeout=5, hidden=1
# 🌉 链式前置 = select, ♻️ 前置容灾, REJECT, policy-select-name=♻️ 前置容灾

# ── 4. 验证与支付 / YouTube：与账号严格同源，只能走落地（不含机场出口，杜绝跨 IP）──
🧩 通用验证与支付 = select, 🤖 AI 服务, REJECT
📹 YouTube = select, 🤖 AI 服务, REJECT

# ── 5. IP 检测组（默认检测落地出口；DIRECT 仅用于对照真实 IP，日常勿选）──
🔍 IP检测 = select, 🤖 AI 服务, 🐦 社交账号, 🚀 自动优选, DIRECT

# ── 6. 业务分流组（无状态资讯/流媒体/公共包镜像卸载至自动优选，不耗落地带宽）──
📰 海外资讯 = select, 🚀 自动优选, 🤖 AI 服务, 🐦 社交账号
📺 国际流媒体 = select, 🚀 自动优选, 🐦 社交账号, 🤖 AI 服务
💻 开发工具 = select, 🚀 自动优选, 🤖 AI 服务

# ── 7. 漏网之鱼（FINAL）：默认自动优选；「漏网审计」时临时切到 REJECT，失败的 App 即暴露未收录域名 ──
🐟 漏网之鱼 = select, 🚀 自动优选, REJECT

# ── 8. 广告与遥测拦截（严禁含 DIRECT，防止误触暴露真实 IP）──
🛑 广告拦截 = select, REJECT, REJECT-DROP, 🚀 自动优选

