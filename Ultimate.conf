🔍 IP检测 = select, 🤖 AI 服务, 🐦 社交账号, 🚀 自动优选, DIRECT

# ── 6. 业务分流组（大流量卸载至非香港优选节点，不耗落地带宽；高价值 TikTok 创作者可将国际流媒体切至 🐦 社交账号）──
📰 海外资讯 = select, 🚀 自动优选, 🤖 AI 服务, 🐦 社交账号
📺 国际流媒体 = select, 🚀 自动优选, 🐦 社交账号, 🤖 AI 服务
# 开发工具默认走自动优选，避免 clone/Release 下载耗尽落地带宽（Copilot 推理与遥测已在 5.8 锁死 AI 组）
💻 开发工具 = select, 🚀 自动优选, 🤖 AI 服务

# ── 7. 漏网之鱼（FINAL）：默认自动优选；「漏网审计」时临时切到 REJECT，失败的 App 即暴露未收录域名 ──
🐟 漏网之鱼 = select, 🚀 自动优选, REJECT

# ── 8. 广告与遥测拦截（严禁含 DIRECT，防止误触暴露真实 IP）──
🛑 广告拦截 = select, REJECT, REJECT-DROP, 🚀 自动优选

