# ── DNS 无泄露架构（100% 纯 IP 形式 DoH 彻底消除引导解析 + #no-h3 省去 QUIC 探测超时 + 禁用 SVCB 防绕过 Fake-IP）──
dns-server = https://223.5.5.5/dns-query#no-h3, https://223.6.6.6/dns-query#no-h3
direct-dns-server = https://223.5.5.5/dns-query#no-h3, https://223.6.6.6/dns-query#no-h3
proxy-dns-server = https://223.5.5.5/dns-query#no-h3, https://223.6.6.6/dns-query#no-h3
fallback-dns-server = https://1.1.1.1/dns-query#proxy#no-h3, https://8.8.8.8/dns-query#proxy#no-h3

dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = false
allow-dns-svcb = false
allow-dns-all = true
use-local-host-item-for-proxy = false

hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 9.9.9.9:53, 208.67.222.222:53, 208.67.220.220:53, 223.5.5.5:53, 223.6.6.6:53, 119.29.29.29:53, 114.114.114.114:53

# 【v18.2 修正】设为 true，防止企业内网（*.internal/*.corp）与 Tailscale（100.64.0.0/10）返回私有 IP 时被误判为 DNS 劫持而强行送入代理
private-ip-answer = true
always-reject-url-rewrite = true
icmp-auto-reply = false

# ── WebRTC STUN 与 QUIC / UDP 严格管控 ──
# 【v18.2 关键安全修复】严禁开启 stun-response-ip = 1.1.1.1 与 stun-response-ipv6 = ::1！
# 原因：开启后会在 TUN 底层强行伪造 1.1.1.1 候选地址，不仅架空第 3 节 STUN 规则，还会导致 BrowserScan / Whoer 报
# “WebRTC 泄露 1.1.1.1”跨 ASN 冲突，被 Cloudflare Turnstile / Arkose 识别为代理篡改异常，并阻碍 ChatGPT 语音回退 TCP。
# stun-response-ip = 1.1.1.1
# stun-response-ipv6 = ::1
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

[Proxy]
# 机场节点由订阅动态提供；落地节点在小火箭首页手动添加：
#   「🗽 纽约ISP落地」（必需）｜「🗽 纽约ISP落地-社交」（可选，社交独立落地时使用）

[Proxy Group]
# ── 1. 自动优选组：【v18.2 升级】仅测速机场的台/新/美/日节点，彻底剔除「香港/HK」节点、本地「ISP落地」与订阅信息伪节点 ──
# 说明：剔除香港节点可 100% 杜绝 TikTok / TikTok Pro / PineDrama 因落入香港 IP 而锁区黑屏，并防止验证组切自动优选时撞上香港风控。
# 🚀 自动优选 = url-test, policy-regex-filter=(?i)^(?!.*(ISP落地|香港|(?<![A-Za-z])HK(?![A-Za-z])|Hong\s*Kong|剩余|流量|到期|过期|重置|套餐|官网|订阅|客服|群组|频道|失联|故障|更新|维护|Traffic|Expire|Reset|Subscribe|Website))(?=.*(台湾|台北|新加坡|狮城|美国|日本|(?<![A-Za-z])(TW|SG|US|JP)(?![A-Za-z])|Taiwan|Taipei|Singapore|United\s*States|America|Japan)).*$, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5
# ── 1. 自动优选组：恢复包含香港（港/台/新/美/日自动测速优选，日常浏览网页与国际流媒体速度最快）──
🚀 自动优选 = url-test, policy-regex-filter=(?i)^(?!.*(ISP落地|剩余|流量|到期|过期|重置|套餐|官网|订阅|客服|群组|频道|失联|故障|更新|维护|Traffic|Expire|Reset|Subscribe|Website))(?=.*(香港|台湾|台北|新加坡|狮城|美国|日本|(?<![A-Za-z])(HK|TW|SG|US|JP)(?![A-Za-z])|Hong\s*Kong|Taiwan|Taipei|Singapore|United\s*States|America|Japan)).*$, url=https://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5

# ── 2. 核心账号锁定组（Fail-Closed：只含落地节点 + REJECT 保底，没有任何成员能让流量滑落到别的 IP）──
🤖 AI 服务 = select, REJECT, policy-regex-filter=^🗽 纽约ISP落地$, policy-select-name=🗽 纽约ISP落地

# 【社交账号落地模式】二选一，只保留一行启用：
#   默认：与 AI 共用「🗽 纽约ISP落地」（成本低；AI 与社交共享一个静态住宅 IP）
#   推荐（已购第二个落地 IP 时）：独立「🗽 纽约ISP落地-社交」，实现「一个账号体系对应一个固定 IP」
🐦 社交账号 = select, REJECT, policy-regex-filter=^🗽 纽约ISP落地$, policy-select-name=🗽 纽约ISP落地
# 🐦 社交账号 = select, REJECT, policy-regex-filter=^🗽 纽约ISP落地-社交$, policy-select-name=🗽 纽约ISP落地-社交

# ── 3. 链式前置（供落地节点「代理通过」调用）──
# 【默认启用：锁定单一前置】账号密码认证与 IP 白名单认证都适用（白名单模式下前置出口 IP 必须固定）：
🌉 链式前置 = select, REJECT, policy-regex-filter=(?i)^(iGG-)?US\s*-\s*洛杉矶(\s*-\s*|\s+)13$, policy-select-name=iGG-US - 洛杉矶 - 13
# 备选单点前置（注释上面一行，改用其一）：
# 🌉 链式前置 = select, REJECT, policy-regex-filter=(?i)^(iGG-)?US\s*-\s*纽约(\s*-\s*|\s+)10$, policy-select-name=iGG-US - 纽约 - 10
# 🌉 链式前置 = select, REJECT, policy-regex-filter=(?i)^(iGG-)?US\s*-\s*美国原生(\s*-\s*|\s+)14$, policy-select-name=iGG-US - 美国原生 - 14
#
# 【可选：容灾模式，仅限落地节点为“账号密码认证”时使用】前置节点变化不会改变目标网站看到的落地 IP，可安全自动容灾。
# 启用方法：注释上面的单点启用行，同时取消下面两行注释（两行必须成对启用）：
# ♻️ 前置容灾 = fallback, policy-regex-filter=(?i)^(?!.*(ISP落地|剩余|流量|到期|过期|重置|套餐|官网|订阅|客服|群组|频道|失联|故障|更新|维护|Traffic|Expire|Reset|Subscribe|Website|Hysteria|HY2|TUIC|WireGuard))(?=.*(美国|(?<![A-Za-z])US(?![A-Za-z])|United\s*States|America|纽约|洛杉矶|西雅图|圣何塞|硅谷|芝加哥|达拉斯|新泽西|华盛顿|亚特兰大)).*$, url=https://www.gstatic.com/generate_204, interval=300, timeout=5, hidden=1
# 🌉 链式前置 = select, ♻️ 前置容灾, REJECT, policy-select-name=♻️ 前置容灾

# ── 4. 验证与支付 / YouTube：默认与 AI 落地严格同源；影响其他网站或想看视频省带宽时，在首页切到「🚀 自动优选」──
🧩 通用验证与支付 = select, 🤖 AI 服务, 🚀 自动优选, REJECT
📹 YouTube = select, 🤖 AI 服务, 🚀 自动优选, REJECT

