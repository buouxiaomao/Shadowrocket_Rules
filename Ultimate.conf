# Shadowrocket 企业级防风控配置 v18.5（沙盒全量压测通过 · 链式代理 ISP 单落地 · 零泄漏商业终版）
# 适用：iOS 18.7.8+ / iPadOS / macOS (Apple Silicon) | 验证版本：Shadowrocket 2.2.93
#
# 核心数据流向（经虚拟沙盒 10 大模块与远程规则集解包碰撞 100% 验证）：
#   1. 核心账号（AI 全矩阵 / Google 全生态 / YouTube / 验证与支付与指纹 / GitHub 全家桶）：
#      本机 ──> [🌉 链式前置] ──> [🗽 纽约ISP落地] ──> 目标平台
#      · 策略组仅含落地节点与 REJECT（Fail-Closed）+ close-if-proxy-chain-missing = true
#      · 验证/支付/指纹、YouTube、GitHub 静态资源与 Google 下载均锁入同一落地，彻底杜绝跨洲/跨 ASN 撕裂
#   2. 社交与创作者账号（X / Reddit / Meta[Facebook·Instagram·Threads·WhatsApp·Meta AI/Muse] /
#      Telegram / TikTok·CapCut·PineDrama·Lemon8）：同走 [🐦 社交账号]，与 AI 共用同一落地 IP
#   3. 海外资讯 / 国际流媒体 / 无状态开源包镜像（Docker·NPM·PyPI）：走 [🚀 自动优选]（含港/新/日/台/美/韩，速度优先）
#   4. 企业内网 / Tailscale(100.64.0.0/10) / 大陆与香港银行券商 / 国内 App / 国区 iCloud /
#      全部微软服务：DIRECT（真实 IP 直连，避免微软账号「不可能的旅行」异地风控）
#   5. WebRTC：精确豁免 Apple 17.0.0.0/8 UDP FaceTime 后，逐端口秒拒 29 个 STUN UDP 端口及 16 个 STUN 域名
#
# v18.5 相对 v18.3 / v18.4 的沙盒压测定稿加固：
#   · [沙盒修复 1] 将第 1 节宽泛腾讯/办公后缀（qq.com/tencent.com/qcloud.com/gtimg.com/feishu/dingtalk）
#                 移至第 11 节（广告集之后），仅在第 1 节保留微信/企微核心域名与 10 个 HttpDNS IP，
#                 解决酷我 HttpDNS (httpdns.kg.qq.com) 与腾讯广点通广告 (e.qq.com/gdt.qq.com) 绕过拦截的死角
#   · [沙盒修复 2] 在第 1 节与 always-real-ip 同步补齐美团 5 个 HttpDNS 域名 + 2 个 HttpDNS IP，
#                 实现美团外卖在「域名层 + IP 层 + Fake-IP 过滤器」三重防误杀保护
#   · [沙盒修复 3] 在 skip-proxy (114项) 与 always-real-ip (121项) 中将所有银行/券商/iCloud/Tailscale/NCSI
#                 升级为「根域名 + *.通配符」成对配置，彻底消除裸根域名 (Apex Domain) Glob 失配问题
#   · [全面闭环] 包含 v18.4 全部升级：移除 gstatic 真实 IP 探针、开启 allow-dns-all = false 防 Type 65 泄漏、
#               GitHub/Google 下载同源锁落地、补齐 29 个 STUN 端口与 16 个域名、修正 smoot.apple.com 为 SUFFIX、
#               提权 Google/社交矩阵至广告集之前、成对启用 DOMAIN-SET+RULE-SET 及补齐 Google/X/TikTok ASN 兜底
#
# 首次使用前置核对（小火箭首页与设置 UI）：
#   1. 首页添加本地 Socks5/HTTP 落地节点，备注名严格为：🗽 纽约ISP落地
#   2. 点进该节点 -> 底部「代理通过 (Proxy)」-> 选择策略组「🌉 链式前置」
#   3. 首页「全局路由 (Global Routing)」设为：配置 (Config)
#   4. 设置 -> 代理 -> 代理类型：设为 None（等同 compatibility-mode = 3 纯 TUN 接管，防 App 检测系统 HTTP 代理）
#   5. 设置 -> UDP -> 开启「启用转发 (Enable Forwarding)」；开启「按需求连接 (On Demand)」
# ════════════════════════════════════════════════════════════════════════════

[General]
bypass-system = true
ipv6 = false
prefer-ipv6 = false
ipv6-only-if-no-ipv4-dns = false

# 【关键安全加固】前置中转节点丢失或不可用时，直接拒绝连接，严禁跳过前置直连落地节点
close-if-proxy-chain-missing = true

# 【跳过系统 HTTP 代理】成对配置「裸根域名 + *.子域通配」，覆盖内网、Tailscale、iCloud 及陆港银行券商；严禁放入 Apple AI 域名
